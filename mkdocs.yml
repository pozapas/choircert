site_name: CHOIR
site_description: A certification layer for ordinal, safety-critical prediction
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - Guarantees: guarantees.md
  - API: api.md
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - admonition
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
