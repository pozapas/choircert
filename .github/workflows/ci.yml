name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" scikit-learn
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest tests/ -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check bundled demo data is in the wheel
        run: |
          python -c "import zipfile, glob; w=glob.glob('dist/*.whl')[0]; \
            assert any('demo_fars.csv' in n for n in zipfile.ZipFile(w).namelist()), \
            'demo data missing from wheel'"
